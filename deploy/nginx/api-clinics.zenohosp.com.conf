# ─────────────────────────────────────────────────────────────────────────────
#  api-clinics.zenohosp.com — Clinics backend
#
#  Install:  /etc/nginx/sites-available/api-clinics
#  Enable:   ln -s ../sites-available/api-clinics /etc/nginx/sites-enabled/
#  TLS:      certbot --nginx -d api-clinics.zenohosp.com
#
#  Plain HTTP on purpose — certbot rewrites this in place (see the note in
#  clinics.zenohosp.com.conf).
#
#  This vhost exists so the OAuth2 callback has a stable, backend-owned
#  address:  https://api-clinics.zenohosp.com/login/oauth2/code/directory
#  That exact string is registered as the clinics-client redirect_uri in
#  Directory and is where the browser is sent after consent. It must match
#  byte-for-byte on both sides or Directory rejects the code exchange.
#
#  Upstream 127.0.0.1:8110 is the clinics-backend container's published host
#  port; the container listens on 8080 internally.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name api-clinics.zenohosp.com;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    listen 80;
}
