# ─────────────────────────────────────────────────────────────────────────────
#  api-clinics.zenohosp.com — Clinics backend (Spring Boot, port 9003)
#
#  Install:  /etc/nginx/sites-available/api-clinics.zenohosp.com
#  Enable:   ln -s ../sites-available/api-clinics.zenohosp.com /etc/nginx/sites-enabled/
#  TLS:      certbot --nginx -d api-clinics.zenohosp.com
#
#  This host exists mainly so the OAuth2 callback has a stable, backend-owned
#  address:  https://api-clinics.zenohosp.com/login/oauth2/code/directory
#  That exact string is registered as the clinics-client redirect_uri in the
#  Directory service and is what the browser is sent to after consent. It must
#  match byte-for-byte on both sides or Directory rejects the exchange.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api-clinics.zenohosp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-clinics.zenohosp.com;

    ssl_certificate     /etc/letsencrypt/live/api-clinics.zenohosp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-clinics.zenohosp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    access_log /var/log/nginx/api-clinics.access.log;
    error_log  /var/log/nginx/api-clinics.error.log;

    location / {
        proxy_pass http://127.0.0.1:9003;
        include /etc/nginx/snippets/clinics-proxy.conf;
    }
}
