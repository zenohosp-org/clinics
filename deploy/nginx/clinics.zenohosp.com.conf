# ─────────────────────────────────────────────────────────────────────────────
#  clinics.zenohosp.com — Clinics frontend (static SPA + same-origin API proxy)
#
#  Install:  /etc/nginx/sites-available/clinics
#  Enable:   ln -s ../sites-available/clinics /etc/nginx/sites-enabled/
#  TLS:      certbot --nginx -d clinics.zenohosp.com
#
#  Written as a plain HTTP vhost on purpose — certbot rewrites it in place,
#  adding the `listen 443 ssl` block and the port-80 redirect, exactly as it
#  did for the hms/labs/pharmacy vhosts. Do not hand-write the TLS block;
#  the certificate paths do not exist until certbot has run, and nginx -t
#  fails on a missing certificate.
#
#  The API is proxied here rather than called cross-origin because the
#  frontend ships with VITE_API_URL=/api (its default). Same-origin means no
#  CORS preflight on the hot path, no SameSite edge cases on the sso_token
#  cookie, and identical behaviour to local dev, where vite.config.js proxies
#  these same four prefixes.
#
#  Upstream is 127.0.0.1:8110 — the host port the clinics-backend container
#  publishes. The container itself listens on 8080; see
#  deploy/docker-compose.clinics.yml.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name clinics.zenohosp.com;
    root /var/www/clinics;
    index index.html;

    # ── API → clinics backend ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host api-clinics.zenohosp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # ── OAuth2 handshake → clinics backend ───────────────────────────────
    # /oauth2/authorization/directory is what the Login button hits.
    # X-Forwarded-Proto is load-bearing: the backend runs
    # server.forward-headers-strategy=FRAMEWORK, so Spring Security builds the
    # redirect_uri from these headers. Without it Spring emits an http:// URI
    # that will not match the https:// one registered in Directory.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host api-clinics.zenohosp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Callback. In the normal flow this is NOT used — the registered
    # redirect_uri points at api-clinics.zenohosp.com, so the browser goes
    # straight to the backend vhost. Kept so a frontend-host redirect_uri
    # would also work, matching how HMS is configured.
    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host api-clinics.zenohosp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Labs service → labs backend ──────────────────────────────────────
    # The frontend defaults to VITE_LABS_API_URL=/labs-api and labs serves its
    # routes under /api, hence the rewrite. Upstream is the labs container's
    # published host port (8107) — NOT 8086, which is only the cosmetic EXPOSE
    # inside that image.
    location /labs-api/ {
        rewrite ^/labs-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8107;
        proxy_set_header Host api-labs.zenohosp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # ── Finance service → finance backend ────────────────────────────────
    # Day book, expenses and GST registers. Upstream 8103 is the finance
    # container's published host port (the 8083 in its Dockerfile is only the
    # cosmetic EXPOSE — and note pharmacy also EXPOSEs 8083, so the host port
    # is the only unambiguous address).
    location /finance-api/ {
        rewrite ^/finance-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8103;
        proxy_set_header Host api-finance.zenohosp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    # react-router owns /dashboard, /patients/:id, … so an unmatched path must
    # return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 80;
}
