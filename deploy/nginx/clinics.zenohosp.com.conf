# ─────────────────────────────────────────────────────────────────────────────
#  clinics.zenohosp.com — Clinics frontend (static SPA + same-origin API proxy)
#
#  Install:  /etc/nginx/sites-available/clinics.zenohosp.com
#  Enable:   ln -s ../sites-available/clinics.zenohosp.com /etc/nginx/sites-enabled/
#  TLS:      certbot --nginx -d clinics.zenohosp.com
#
#  Why the API is proxied here rather than called cross-origin:
#  the frontend ships with VITE_API_URL=/api (its default), so every request is
#  same-origin. That means no CORS preflight on the hot path and no SameSite
#  edge cases on the sso_token cookie. It also makes production behave exactly
#  like local dev, where vite.config.js proxies the same four prefixes.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name clinics.zenohosp.com;
    # certbot rewrites this block to a 301 → https once TLS is issued.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinics.zenohosp.com;

    # ── TLS (certbot fills these in) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/clinics.zenohosp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinics.zenohosp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/clinics;
    index index.html;

    # Patient documents and scans can be large; the backend caps uploads at
    # 10MB (spring.servlet.multipart.max-file-size) so allow a little headroom.
    client_max_body_size 12m;

    access_log /var/log/nginx/clinics.access.log;
    error_log  /var/log/nginx/clinics.error.log;

    # ── Static assets ─────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API → clinics backend ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:9003;
        include /etc/nginx/snippets/clinics-proxy.conf;
    }

    # ── OAuth2 handshake → clinics backend ────────────────────────────────
    # /oauth2/authorization/directory is what the Login button hits.
    # /login/oauth2/code/directory is the callback; note the registered
    # redirect_uri points at api-clinics.zenohosp.com, so in the normal flow
    # the callback does NOT come through here — this is kept so a redirect_uri
    # pointed at the frontend host would also work.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:9003;
        include /etc/nginx/snippets/clinics-proxy.conf;
    }

    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:9003;
        include /etc/nginx/snippets/clinics-proxy.conf;
    }

    # ── Labs service → labs backend ───────────────────────────────────────
    # The frontend defaults to VITE_LABS_API_URL=/labs-api and labs expects
    # its routes under /api, hence the rewrite. Assumes labs runs on this same
    # VPS on 8086 (as the other zenohosp services do). If labs is remote,
    # replace the proxy_pass with https://api-labs.zenohosp.com/api/ and add
    #   resolver 1.1.1.1 valid=300s;
    #   proxy_ssl_server_name on;
    # and make sure the labs CORS list includes https://clinics.zenohosp.com.
    location /labs-api/ {
        rewrite ^/labs-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8086;
        include /etc/nginx/snippets/clinics-proxy.conf;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # react-router owns client-side routes (/dashboard, /patients/:id, …), so
    # any unmatched path must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
