# ─────────────────────────────────────────────────────────────────────────────
#  Shared proxy headers for the clinics vhosts.
#  Install to: /etc/nginx/snippets/clinics-proxy.conf
#
#  X-Forwarded-Proto matters more than it looks: the backend runs
#  server.forward-headers-strategy=FRAMEWORK, and Spring Security builds the
#  OAuth2 redirect_uri from the forwarded headers. Without these, Spring sees
#  a plain-HTTP request and generates an http:// redirect_uri, which will not
#  match the https:// one registered in Directory — the SSO handshake then
#  fails with an opaque invalid_grant.
# ─────────────────────────────────────────────────────────────────────────────

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Upgrade support (not used today, but harmless and needed if a websocket
# endpoint is ever added).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";

# Spring Boot cold starts and report generation can exceed the 60s default.
proxy_connect_timeout 30s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_buffering off;
