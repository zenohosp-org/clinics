# ─────────────────────────────────────────────────────────────────────────────
#  Clinics backend — service block to merge into /opt/zenohosp/docker-compose.yml
#
#  NOT deployed as-is. Copy the `clinics-backend` service into that file's
#  `services:` map, because the deploy workflow runs
#      docker compose up -d --build clinics-backend
#  from /opt/zenohosp and resolves the service from that one file.
#
#  Conventions below are taken from the live compose file, not from the
#  Dockerfile. Three of them are easy to get wrong:
#
#   1. Every backend runs on port 8080 INSIDE the container. The shared
#      `x-backend-defaults` anchor sets PORT: 8080, and compose `environment:`
#      overrides `env_file:`, so a PORT= line in the env file is inert. The
#      EXPOSE in the Dockerfile (9003) is cosmetic.
#   2. Each service publishes to a unique 127.0.0.1:81xx host port. Loopback
#      only — nginx is the sole ingress. 8101 pharmacy · 8102 asset ·
#      8103 finance · 8104 inventory · 8105 directory · 8106 ot · 8107 labs ·
#      8108 people · 8109 hms → clinics takes 8110.
#   3. Config comes from ./env/<app>.env, not a shared root .env.
# ─────────────────────────────────────────────────────────────────────────────

services:
  clinics-backend:
    # Reuses the x-backend-defaults anchor already defined at the top of the
    # live compose file (restart policy, mem_limit, PORT/JVM env, healthcheck).
    <<: *backend
    build: ./clinics/clinics-backend
    env_file: ./env/clinics.env
    ports: ["127.0.0.1:8110:8080"]
