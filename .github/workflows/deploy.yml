name: Deploy backend to VPS
on:
  push:
    branches: [main]
    paths:
      - 'clinics-backend/**'
      - '.github/workflows/deploy.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/zenohosp/clinics
            git pull origin main
            cd /opt/zenohosp
            # No pre-deploy DB snapshot here, unlike the HMS workflow.
            #
            # Clinics shares HMS's database but runs spring.jpa.hibernate.ddl-auto=none
            # (see clinics-backend/src/main/resources/application.properties), so a
            # clinics deploy can never alter the schema — there is nothing for a
            # restore point to protect against. HMS owns the schema and its own
            # deploy takes the snapshot before any DDL runs.
            #
            # If clinics is ever switched to ddl-auto=update, copy the snapshot
            # gate from the HMS workflow back in FIRST.
            docker compose up -d --build clinics-backend
