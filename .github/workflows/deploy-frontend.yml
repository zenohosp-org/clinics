name: Deploy frontend to VPS
on:
  push:
    branches: [main]
    paths:
      - 'clinics-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  # Manual trigger from the Actions tab — for redeploying without a code change.
  workflow_dispatch:

# Shares one concurrency group with the backend workflow — see the comment in
# deploy.yml. Both drive the same checkout at /opt/zenohosp/clinics, so they
# must never run at the same time.
concurrency:
  group: clinics-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/zenohosp/clinics
            # See deploy.yml — deploy checkout must mirror origin exactly.
            git fetch origin main
            git reset --hard origin/main
            cd clinics-frontend
            npm ci
            npm run build
            # Build into a staging dir and swap, so a failed build can't leave
            # /var/www/clinics empty and the site 404ing. `set -e` means we
            # never reach the swap unless the build succeeded.
            mkdir -p /var/www/clinics
            rm -rf /var/www/clinics.new
            cp -r dist /var/www/clinics.new
            rm -rf /var/www/clinics.old
            mv /var/www/clinics /var/www/clinics.old
            mv /var/www/clinics.new /var/www/clinics
            rm -rf /var/www/clinics.old
            ls -la /var/www/clinics | head -5
