spring.application.name=zenoclinics

# ──────────────────────────────────────────────
# Database — PostgreSQL (Supabase Pooled)
# ──────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase transaction pooler (6543) drops idle server-side connections; recycle
# Hikari connections before the pooler does, and validate on borrow, so the picker
# (and every endpoint) doesn't intermittently 500 after an idle gap.
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# ──────────────────────────────────────────────
# JPA / Hibernate
#
# ddl-auto=none — deliberate, and different from HMS.
#
# Clinics shares HMS's Supabase database (same tables, same rows). HMS runs
# ddl-auto=update and is the sole owner of that schema. If Clinics also ran
# `update`, two services would race to alter the same tables on boot, and a
# drift between the two codebases' entities would silently mutate production
# columns. Clinics therefore only ever reads/writes rows — never DDL.
#
# Consequence: a schema change for a Clinics feature must land in HMS's
# entities (or a migration) first, then Clinics picks it up. See DEPLOYMENT.md.
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none

# The inherited DataSeeder runs raw DDL (column renames, constraint drops,
# CREATE TABLE) outside Hibernate, so ddl-auto=none does not stop it. Off by
# default for the same reason ddl-auto is none — HMS owns the shared schema.
# See DataSeeder's class javadoc before turning this on.
clinics.data-seeder.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ──────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

# ──────────────────────────────────────────────
# SSO Cookie (shared HttpOnly cookie — matches sso_token used across all zenohosp apps)
# ──────────────────────────────────────────────
sso.cookie.name=${SSO_COOKIE_NAME:sso_token}
sso.cookie.domain=${SSO_COOKIE_DOMAIN:localhost}
sso.cookie.secure=${SSO_COOKIE_SECURE:false}
sso.cookie.max-age=${SSO_COOKIE_MAX_AGE:86400}

# ──────────────────────────────────────────────
# Server
# ──────────────────────────────────────────────
# 9003 — 9000 directory, 9001 HMS, 9002 people are already taken.
server.port=${PORT:9003}
# Distinct from HMS_SESSION so a browser signed into both apps on
# *.zenohosp.com doesn't have the two servlet sessions overwrite each other.
server.servlet.session.cookie.name=CLINICS_SESSION
server.forward-headers-strategy=FRAMEWORK

# ──────────────────────────────────────────────
# Timezone — all hospitals run in IST. Dockerfile pins the JVM via TZ env +
# -Duser.timezone, but this also makes Jackson emit Instant/Date with the
# IST offset rather than UTC by default.
# ──────────────────────────────────────────────
spring.jackson.time-zone=Asia/Kolkata

# ──────────────────────────────────────────────
# Debug
# ──────────────────────────────────────────────
logging.level.com.zenlocare=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ──────────────────────────────────────────────
# Google OAuth2
# ──────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ──────────────────────────────────────────────
# Directory SSO OAuth2 Client
# ──────────────────────────────────────────────
spring.security.oauth2.client.registration.directory.client-id=${DIRECTORY_CLIENT_ID:clinics-client}
spring.security.oauth2.client.registration.directory.client-secret=${DIRECTORY_CLIENT_SECRET}
spring.security.oauth2.client.registration.directory.authorization-grant-type=authorization_code
# The OAuth callback lands on the BACKEND host (api-clinics), not the frontend —
# same as pharmacy/labs/finance. HMS routes it via its frontend domain only
# because Vercel rewrites /login/* back to the API; on the VPS nginx setup the
# backend answers directly, so there is no proxy hop to depend on.
# Must byte-for-byte match the redirect-uri registered for clinics-client in Directory.
spring.security.oauth2.client.registration.directory.redirect-uri=${OAUTH_REDIRECT_URI:https://api-clinics.zenohosp.com/login/oauth2/code/directory}
spring.security.oauth2.client.registration.directory.scope=read

# Directory server endpoints — hardcoded (infrastructure constant, not per-environment)
spring.security.oauth2.client.provider.directory.authorization-uri=https://api-directory.zenohosp.com/oauth2/authorize
spring.security.oauth2.client.provider.directory.token-uri=https://api-directory.zenohosp.com/oauth2/token
spring.security.oauth2.client.provider.directory.user-info-uri=https://api-directory.zenohosp.com/api/users/me
spring.security.oauth2.client.provider.directory.user-name-attribute=email

# Directory base URL (used by AuthService for credential login proxy)
directory.api.url=https://api-directory.zenohosp.com

# Frontend URL (for post-SSO redirect)
frontend.url=${FRONTEND_URL:https://clinics.zenohosp.com}

# ──────────────────────────────────────────────
# Multipart uploads — wired now so when the attachment upload feature
# lands the endpoint already has a sane default policy. 10MB cap on
# a single file, spooled to disk above 512KB so a large upload
# doesn't pin heap for the duration of the request.
# ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.file-size-threshold=512KB

# ──────────────────────────────────────────────
# Labs service (radiology + health checkups now owned by labs).
# HMS backend calls labs over RestTemplate for the appointment +
# smart-billing cross-cuts; the frontend hits labs directly for those
# domains. Default points to the local labs port; production sets
# LABS_API_URL=https://api-labs.zenohosp.com via env.
# ──────────────────────────────────────────────
labs.api.url=${LABS_API_URL:https://api-labs.zenohosp.com}

# ──────────────────────────────────────────────
# Asset-manager service. Source of truth for the assets/categories/
# vendors/AMC/maintenance schema. HMS proxies read-only asset retrieval
# (GET /api/assets, GET /api/assets/{id}) through to this URL so the
# frontend can ask its own backend without learning a second base URL.
# Default points to the local asset-manager port; production sets
# ASSETS_API_URL=https://api-asset.zenohosp.com via env.
# ──────────────────────────────────────────────
assets.api.url=${ASSETS_API_URL:http://localhost:8081}

# ── Actuator (health probe; /actuator/health is already permitted in SecurityConfig) ──
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ──────────────────────────────────────────────
# Insurance claims aging — the daily ClaimAgingScheduler flags any claim whose
# pending_with != NONE and whose age (days since it entered its current pending
# state) exceeds this threshold. Sprint 1: log only.
# ──────────────────────────────────────────────
claims.aging.threshold-days=3
