# Sprint-1 claims verification profile — points at a THROWAWAY local Postgres,
# never the Supabase instance. Hibernate builds the whole schema fresh so the
# generated claim_events DDL can be inspected with real psql \d.
spring.datasource.url=jdbc:postgresql://localhost:5432/hms_sprint1_verify
spring.datasource.username=iniyananbu
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# create (not create-drop) so tables persist after the run for \d inspection.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Dummy secrets so the context boots offline (no real SSO/OAuth calls are made in the test).
jwt.secret=verify-only-dummy-hmac-secret-key-please-ignore-0123456789
jwt.expiration=86400
DB_URL=jdbc:postgresql://localhost:5432/hms_sprint1_verify
DB_USER=iniyananbu
DB_PASS=
JWT_SECRET=verify-only-dummy-hmac-secret-key-please-ignore-0123456789
FRONTEND_URL=http://localhost:5173
GOOGLE_CLIENT_ID=verify-dummy
GOOGLE_CLIENT_SECRET=verify-dummy
DIRECTORY_CLIENT_ID=verify-dummy
DIRECTORY_CLIENT_SECRET=verify-dummy

# Aging threshold kept at the default so the job's behaviour is the real one.
claims.aging.threshold-days=3

# Quiet the boot logs; the test prints the artifacts we care about explicitly.
logging.level.com.zenlocare=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
